<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            margin-bottom: 20px;
            color: #667eea;
        }

        .loading {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .hidden {
            display: none;
        }

        .info-box {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: left;
            font-size: 13px;
        }

        .info-box p {
            margin: 5px 0;
            color: #666;
        }

        .view-link {
            margin-top: 20px;
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .view-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome</h1>
        <p>Please wait while we verify your connection...</p>
        
        <div id="loading" class="loading"></div>
        
        <div id="status" class="status hidden"></div>
        
        <div id="info" class="info-box hidden">
            <p><strong>IP:</strong> <span id="ip"></span></p>
            <p><strong>Browser:</strong> <span id="browser"></span></p>
            <p><strong>OS:</strong> <span id="os"></span></p>
            <p><strong>Screen:</strong> <span id="screen"></span></p>
            <p><strong>Time:</strong> <span id="time"></span></p>
        </div>

        <a href="viewer.html" class="view-link">View Logs →</a>
    </div>

    <script>
        // Get device info
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let browser = "Unknown";
            let os = "Unknown";

            // Detect browser
            if (ua.indexOf("Chrome") > -1) browser = "Chrome";
            else if (ua.indexOf("Safari") > -1) browser = "Safari";
            else if (ua.indexOf("Firefox") > -1) browser = "Firefox";
            else if (ua.indexOf("Edge") > -1) browser = "Edge";
            else if (ua.indexOf("Opera") > -1) browser = "Opera";

            // Detect OS
            if (ua.indexOf("Windows") > -1) os = "Windows";
            else if (ua.indexOf("Mac") > -1) os = "MacOS";
            else if (ua.indexOf("Linux") > -1) os = "Linux";
            else if (ua.indexOf("Android") > -1) os = "Android";
            else if (ua.indexOf("iOS") > -1) os = "iOS";

            return {
                userAgent: ua,
                browser: browser,
                os: os,
                screenResolution: `${window.screen.width}x${window.screen.height}`,
                colorDepth: window.screen.colorDepth,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                language: navigator.language,
                platform: navigator.platform,
                cookiesEnabled: navigator.cookieEnabled,
                javaEnabled: navigator.javaEnabled(),
                timestamp: new Date().toISOString()
            };
        }

        // Capture and log data
        async function captureData() {
            const statusDiv = document.getElementById('status');
            const loadingDiv = document.getElementById('loading');
            const infoDiv = document.getElementById('info');

            try {
                // Get IP from API
                const response = await fetch('https://ipapi.co/json/');
                const ipData = await response.json();
                
                const deviceInfo = getDeviceInfo();
                
                // Combine all data
                const logEntry = {
                    id: Date.now(),
                    ip: ipData.ip,
                    city: ipData.city,
                    region: ipData.region,
                    country: ipData.country_name,
                    countryCode: ipData.country,
                    postal: ipData.postal,
                    latitude: ipData.latitude,
                    longitude: ipData.longitude,
                    isp: ipData.org,
                    ...deviceInfo
                };

                // Store in localStorage
                let logs = JSON.parse(localStorage.getItem('ipLogs') || '[]');
                logs.unshift(logEntry); // Add to beginning
                localStorage.setItem('ipLogs', JSON.stringify(logs));

                // Update UI
                document.getElementById('ip').textContent = logEntry.ip;
                document.getElementById('browser').textContent = logEntry.browser;
                document.getElementById('os').textContent = logEntry.os;
                document.getElementById('screen').textContent = logEntry.screenResolution;
                document.getElementById('time').textContent = new Date(logEntry.timestamp).toLocaleString();

                loadingDiv.style.display = 'none';
                infoDiv.classList.remove('hidden');
                statusDiv.textContent = '✓ Data captured successfully';
                statusDiv.className = 'status success';

            } catch (error) {
                loadingDiv.style.display = 'none';
                statusDiv.textContent = '✗ Error: ' + error.message;
                statusDiv.className = 'status error';
                console.error('Capture error:', error);
            }
        }

        // Run on page load
        window.addEventListener('load', captureData);
    </script>
</body>
</html>
