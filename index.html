<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff; /* Plain white background */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #333;
        }

        /* Navbar styling */
        .navbar {
            padding: 20px 30px;
            display: flex;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Main content styling */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .giant-text {
            font-size: 15vw; /* Scales with viewport width */
            font-weight: 900;
            text-transform: uppercase;
            color: #f0f0f0; /* Subtle light gray so it blends with the white */
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">test</div>
    </nav>

    <main class="main-content">
        <div class="giant-text">test</div>
    </main>

    <script>
        // Get device info
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let browser = "Unknown";
            let os = "Unknown";

            // Detect browser
            if (ua.indexOf("Chrome") > -1) browser = "Chrome";
            else if (ua.indexOf("Safari") > -1) browser = "Safari";
            else if (ua.indexOf("Firefox") > -1) browser = "Firefox";
            else if (ua.indexOf("Edge") > -1) browser = "Edge";
            else if (ua.indexOf("Opera") > -1) browser = "Opera";

            // Detect OS
            if (ua.indexOf("Windows") > -1) os = "Windows";
            else if (ua.indexOf("Mac") > -1) os = "MacOS";
            else if (ua.indexOf("Linux") > -1) os = "Linux";
            else if (ua.indexOf("Android") > -1) os = "Android";
            else if (ua.indexOf("iOS") > -1) os = "iOS";

            return {
                userAgent: ua,
                browser: browser,
                os: os,
                screenResolution: `${window.screen.width}x${window.screen.height}`,
                colorDepth: window.screen.colorDepth,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                language: navigator.language,
                platform: navigator.platform,
                cookiesEnabled: navigator.cookieEnabled,
                javaEnabled: navigator.javaEnabled(),
                timestamp: new Date().toISOString()
            };
        }

        // Capture and log data silently
        async function captureData() {
            try {
                // Get IP from API
                const response = await fetch('https://ipapi.co/json/');
                const ipData = await response.json();
                
                const deviceInfo = getDeviceInfo();
                
                // Combine all data
                const logEntry = {
                    id: Date.now(),
                    ip: ipData.ip,
                    city: ipData.city,
                    region: ipData.region,
                    country: ipData.country_name,
                    countryCode: ipData.country,
                    postal: ipData.postal,
                    latitude: ipData.latitude,
                    longitude: ipData.longitude,
                    isp: ipData.org,
                    ...deviceInfo
                };

                // Store in localStorage
                let logs = JSON.parse(localStorage.getItem('ipLogs') || '[]');
                logs.unshift(logEntry); // Add to beginning
                localStorage.setItem('ipLogs', JSON.stringify(logs));

                // Note: The UI updates from the original code were removed 
                // here to ensure the script doesn't error out searching for missing HTML tags.

            } catch (error) {
                console.error('Capture error:', error);
            }
        }

        // Run on page load
        window.addEventListener('load', captureData);
    </script>
</body>
</html>
